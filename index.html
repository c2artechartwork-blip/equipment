<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>C2 장비 반출·반납</title>
<link rel="icon" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<style>
@font-face { font-family: 'Pretendard'; src: url('PretendardVariable.woff2') format('woff2-variations'); font-weight: 45 920; font-display: swap; }
:root {
  --y: #F5B618; --k: #111; --bg: #F5F5F3; --line: #E4E4E0; --mute: #777; --ok: #2F855A; --okbg: #E8F5EE;
  --out: #2563EB; --outbg: #E8F0FE; --bad: #C53030; --badbg: #FDECEC;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--k); font-size: 16px; line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }
.hidden { display: none !important; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: -.02em; }
.mute { color: var(--mute); }
.small { font-size: 13px; }

header { position: sticky; top: 0; z-index: 10; background: var(--k); color: #fff; display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); }
header img { height: 22px; display: block; }
header .who { margin-left: auto; font-size: 14px; color: #ccc; background: none; border: 1px solid #333; border-radius: 999px; padding: 8px 14px; min-height: 40px; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border-radius: 14px; border: 0; font-weight: 800; font-size: 18px; cursor: pointer; text-decoration: none; }
.btn:disabled { opacity: .45; }
.btn.y { background: var(--y); color: var(--k); }
.btn.k { background: var(--k); color: #fff; }
.btn.w { background: #fff; color: var(--k); border: 1px solid var(--line); font-weight: 700; font-size: 16px; min-height: 48px; }
.btn.sm { min-height: 38px; font-size: 14px; width: auto; padding: 0 14px; border-radius: 10px; }
.btn.big { min-height: 120px; font-size: 26px; border-radius: 20px; flex-direction: column; gap: 6px; }
.btn.big small { font-size: 14px; font-weight: 600; opacity: .7; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
label.f { display: block; font-size: 13px; font-weight: 700; color: var(--mute); margin-bottom: 6px; }
.in { width: 100%; min-height: 52px; border: 1px solid #CFCFCA; border-radius: 12px; padding: 0 14px; background: #fff; font-size: 17px; outline: none; }
.in:focus { border-color: var(--k); }
textarea.in { padding: 12px 14px; min-height: 120px; }
.pin { letter-spacing: .6em; text-align: center; font-size: 26px; font-weight: 800; }
h2 { margin: 4px 0 12px; font-size: 20px; }
.section { margin: 22px 0 8px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; }

.list { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EEE; cursor: pointer; min-height: 64px; }
.item:last-child { border-bottom: 0; }
.item .nm { font-weight: 800; }
.item .sub { font-size: 13px; color: var(--mute); }
.item .grow { flex: 1; min-width: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--mute); }
.badge { font-size: 13px; font-weight: 800; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.b-in { background: var(--okbg); color: var(--ok); }
.b-out { background: var(--outbg); color: var(--out); }
.b-late { background: var(--badbg); color: var(--bad); }
.b-off { background: #EEE; color: #888; }

.tabs { display: flex; background: #E9E9E5; border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.tabs button { flex: 1; border: 0; background: none; min-height: 44px; border-radius: 10px; font-weight: 800; color: var(--mute); }
.tabs button.on { background: #fff; color: var(--k); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* 스캔 */
.cam { position: relative; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 1/1; }
#reader { width: 100%; height: 100%; }
#reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
.frame { position: absolute; inset: 18%; border: 3px solid var(--y); border-radius: 18px; pointer-events: none; }
.camoff { position: absolute; inset: 0; color: #ddd; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }

/* 시트 */
.back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; animation: up .16s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: #DDD; margin: 4px auto 14px; }
.eqname { font-size: 24px; font-weight: 900; line-height: 1.25; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; min-height: 38px; padding: 0 14px; font-weight: 700; font-size: 14px; }
.chips button.on { background: var(--k); color: #fff; border-color: var(--k); }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 15px; margin: 12px 0; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; font-weight: 700; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 99; width: calc(100% - 32px); max-width: 420px; }
.t { background: var(--k); color: #fff; padding: 14px 16px; border-radius: 14px; margin-top: 8px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.t.err { background: #8E1F1F; }
.t.ok { border-left: 6px solid var(--y); }

.login { min-height: 100vh; min-height: 100dvh; background: var(--k); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 22px; }
.login img { width: 200px; }
.login .card { width: 100%; max-width: 360px; background: #1A1A1A; border-color: #2B2B2B; color: #fff; }
.login .in { background: #111; border-color: #3A3A3A; color: #fff; }
.login label.f { color: #AAA; }
.login .tabs { background: #222; }
.login .tabs button { color: #888; }
.login .tabs button.on { background: #333; color: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { padding: 8px 6px; border-bottom: 1px solid #EEE; text-align: left; vertical-align: top; }
th { color: var(--mute); font-size: 12px; }

/* 라벨 인쇄: 폼텍 3108 (A4 24칸, 64×33.9mm) */
#print { display: none; }
@media print {
  @page { size: A4; margin: 0; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; }
  .sheetA4 { width: 210mm; height: 297mm; position: relative; page-break-after: always; }
  .lab { position: absolute; width: 64mm; height: 33.9mm; display: flex; align-items: center; gap: 2.5mm; padding: 2.5mm 3mm; box-sizing: border-box; overflow: hidden; font-family: 'Pretendard', sans-serif; }
  .lab svg { width: 27mm; height: 27mm; flex: none; }
  .lab img { width: 22mm; display: block; margin-bottom: 1.5mm; }
  .lab .id { font: 800 11pt ui-monospace, Menlo, monospace; }
  .lab .n { font-size: 7.5pt; font-weight: 600; line-height: 1.2; max-height: 9mm; overflow: hidden; }
  .lab .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 1.6mm; background: #F5B618; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<div id="print"></div>
<div id="filescan" class="hidden"></div>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script src="html5-qrcode.min.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.C2EM_CONFIG || {};
  var app = document.getElementById('app');
  var S = { auth: null, scanner: null, busy: false, last: '', lastT: 0, view: 'home' };

  // ---------- 유틸 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function rid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, ''); }
  function today() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
  function addDays(d, n) { var p = d.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]) + n * 864e5).toISOString().slice(0, 10); }
  function md(d) { return d ? (+d.slice(5, 7)) + '/' + (+d.slice(8, 10)) : ''; }
  function toast(m, err) {
    var t = document.createElement('div'); t.className = 't ' + (err ? 'err' : 'ok'); t.textContent = m;
    $('#toast').appendChild(t); setTimeout(function () { t.remove(); }, err ? 4500 : 2200);
  }
  function vib(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* noop */ } }
  function badge(it) {
    if (!it.active) return '<span class="badge b-off">숨김</span>';
    if (it.status === '반출') return it.late ? '<span class="badge b-late">지연 · ' + esc(it.holder) + '</span>' : '<span class="badge b-out">반출 · ' + esc(it.holder) + '</span>';
    return '<span class="badge b-in">보유</span>';
  }

  // ---------- API ----------
  function post(body) {
    return fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('net'); return r.json(); });
  }
  function api(action, payload) {
    var body = JSON.stringify({ action: action, payload: payload || {}, auth: S.auth ? { name: S.auth.name, token: S.auth.token } : null });
    return post(body).catch(function () { return post(body); }) // 네트워크 오류 1회 재시도 (같은 request_id)
      .catch(function () { throw { code: 'NET', message: '인터넷 연결을 확인하세요.' }; })
      .then(function (r) {
        if (r.ok) return r.data;
        if (r.error.code === 'AUTH' && S.auth) { store('c2s.auth', null); S.auth = null; setTimeout(showLogin, 50); }
        throw r.error;
      });
  }
  function fail(e) { toast(e && e.message || '오류가 발생했습니다.', true); }

  // ---------- 로그인 / 가입 ----------
  function showLogin(mode) {
    stopCam();
    mode = mode || 'login';
    app.innerHTML = '<div class="login"><img src="logo-h-yellow.png" alt="C2 ARTECHNOLOZY"><div style="letter-spacing:.18em;font-weight:800;color:var(--y);font-size:13px">장비 반출 · 반납</div>' +
      '<div class="card"><div class="tabs"><button data-m="login" class="' + (mode === 'login' ? 'on' : '') + '">로그인</button><button data-m="signup" class="' + (mode === 'signup' ? 'on' : '') + '">처음이에요</button></div>' +
      '<form class="stack" id="lf"><div><label class="f">이름</label><input class="in" id="ln" autocomplete="username" maxlength="20" value="' + esc((store('c2s.lastName') || '')) + '" placeholder="예: 홍길동"></div>' +
      '<div><label class="f">' + (mode === 'signup' ? '사용할 PIN (숫자 4자리)' : 'PIN 4자리') + '</label><input class="in pin" id="lp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="' + (mode === 'signup' ? 'new-password' : 'current-password') + '"></div>' +
      (mode === 'signup' ? '<div><label class="f">PIN 한 번 더</label><input class="in pin" id="lp2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"></div>' : '') +
      '<button class="btn y" id="lb">' + (mode === 'signup' ? '가입하고 시작' : '로그인') + '</button></form>' +
      '<p class="small" style="color:#888;margin:12px 0 0;text-align:center">' + (mode === 'signup' ? '이름은 반출·반납 기록에 그대로 남습니다.' : 'PIN을 잊었으면 관리자에게 초기화를 요청하세요.') + '</p></div></div>';
    $$('[data-m]').forEach(function (b) { b.onclick = function () { showLogin(b.getAttribute('data-m')); }; });
    $('#lf').onsubmit = function (e) {
      e.preventDefault();
      var name = $('#ln').value.trim(), pin = $('#lp').value.trim();
      if (!name) return toast('이름을 입력하세요.', true);
      if (!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.', true);
      if (mode === 'signup' && pin !== $('#lp2').value.trim()) return toast('PIN이 서로 다릅니다.', true);
      var b = $('#lb'); b.disabled = true;
      api(mode, { name: name, pin: pin }).then(function (d) {
        S.auth = { name: d.user.name, role: d.user.role, token: d.token };
        store('c2s.auth', S.auth); store('c2s.lastName', d.user.name);
        if (mode === 'signup' && d.user.role === '관리자') toast('첫 가입자라 관리자가 되었습니다.');
        home();
      }).catch(function (e) {
        b.disabled = false;
        if (e.code === 'RESET' || e.code === 'NOT_FOUND') { toast(e.message, true); return showLogin('signup'); }
        fail(e);
      });
    };
    setTimeout(function () { ($('#ln').value ? $('#lp') : $('#ln')).focus(); }, 50);
  }

  // ---------- 화면 틀 ----------
  function shell(inner) {
    stopCam();
    app.innerHTML = '<header><img src="logo-h-yellow.png" alt="C2" id="hl"><button class="who" id="who">' + esc(S.auth.name) + (S.auth.role === '관리자' ? ' · 관리자' : '') + '</button></header><main id="v">' + inner + '</main>';
    $('#hl').onclick = home;
    $('#who').onclick = function () {
      if (confirm(S.auth.name + ' 계정에서 로그아웃할까요?')) { store('c2s.auth', null); S.auth = null; showLogin(); }
    };
    return $('#v');
  }

  // ---------- 홈 ----------
  function home() {
    S.view = 'home';
    var v = shell('<button class="btn y big" id="go"><span>QR 스캔</span><small>장비 QR을 비추면 반출 · 반납</small></button>' +
      '<div class="section"><span>내가 가진 장비</span><span class="mute small" id="cnt"></span></div><div class="list" id="mine"><div class="empty">불러오는 중…</div></div>' +
      '<div class="row" style="margin-top:16px"><button class="btn w" id="all">전체 장비 현황</button>' + (S.auth.role === '관리자' ? '<button class="btn w" id="adm">관리</button>' : '') + '</div>');
    $('#go').onclick = scan;
    $('#all').onclick = all;
    if ($('#adm')) $('#adm').onclick = function () { admin('eq'); };
    api('me').then(function (d) {
      S.auth.role = d.user.role; store('c2s.auth', S.auth);
      $('#cnt').textContent = d.mine.length ? d.mine.length + '개' : '';
      $('#mine').innerHTML = d.mine.length ? d.mine.map(rowHtml).join('') : '<div class="empty">지금 가진 장비가 없습니다.</div>';
      bindRows($('#mine'), d.mine, home);
    }).catch(fail);
  }
  function rowHtml(it) {
    var sub = it.status === '반출' ? '반납 ' + md(it.due_date) + (it.place ? ' · ' + esc(it.place) : '') : '';
    return '<div class="item" data-id="' + esc(it.id) + '"><div class="grow"><div class="nm">' + esc(it.name) + '</div><div class="sub"><span class="mono">' + esc(it.id) + '</span>' + (sub ? ' · ' + sub : '') + '</div></div>' + badge(it) + '</div>';
  }
  function bindRows(root, items, after) {
    $$('.item[data-id]', root).forEach(function (el) {
      el.onclick = function () { var it = items.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; itemSheet(it, after); };
    });
  }

  // ---------- 전체 현황 ----------
  function all() {
    S.view = 'all';
    var v = shell('<h2>전체 장비</h2><input class="in" id="q" placeholder="이름 · 관리번호 · 사람 검색"><div class="tabs" style="margin-top:10px"><button data-f="" class="on">전체</button><button data-f="보유">보유</button><button data-f="반출">반출</button><button data-f="late">지연</button></div><div class="list" id="l"><div class="empty">불러오는 중…</div></div>' +
      '<button class="btn w" style="margin-top:16px" id="bk">처음으로</button>');
    $('#bk').onclick = home;
    var f = '';
    api('list').then(function (d) {
      function render() {
        var q = $('#q').value.trim().toLowerCase();
        var items = d.items.filter(function (it) {
          if (f === 'late' ? !it.late : f && it.status !== f) return false;
          return !q || (it.name + ' ' + it.id + ' ' + it.holder + ' ' + it.place).toLowerCase().indexOf(q) >= 0;
        });
        $('#l').innerHTML = items.length ? items.map(rowHtml).join('') : '<div class="empty">없습니다.</div>';
        bindRows($('#l'), items, all);
      }
      $('#q').oninput = render;
      $$('[data-f]').forEach(function (b) { b.onclick = function () { f = b.getAttribute('data-f'); $$('[data-f]').forEach(function (x) { x.classList.toggle('on', x === b); }); render(); }; });
      render();
    }).catch(fail);
  }

  // ---------- 스캔 ----------
  function scan() {
    S.view = 'scan';
    var v = shell('<div class="cam"><div id="reader"></div><div class="frame"></div><div class="camoff hidden" id="off"></div></div>' +
      '<p class="mute small" style="text-align:center;margin:10px 0">QR을 노란 네모 안에 맞추세요</p>' +
      '<form class="row" id="mf"><input class="in mono" id="mc" placeholder="관리번호 직접 입력 (C2-0001)" autocapitalize="characters" style="flex:2"><button class="btn k sm" style="min-height:52px">확인</button></form>' +
      '<label class="btn w" style="margin-top:10px">사진 찍어서 QR 인식<input type="file" accept="image/*" capture="environment" id="fs" class="hidden"></label>' +
      '<button class="btn w" style="margin-top:10px" id="bk">처음으로</button>');
    $('#bk').onclick = home;
    $('#mf').onsubmit = function (e) { e.preventDefault(); var c = $('#mc').value.trim(); if (c) { $('#mc').value = ''; onCode(c, true); } };
    $('#fs').onchange = function (e) {
      var file = e.target.files[0]; e.target.value = '';
      if (!file || !window.Html5Qrcode) return;
      new Html5Qrcode('filescan').scanFile(file, false).then(function (c) { onCode(c, true); }).catch(function () { toast('사진에서 QR을 못 찾았습니다. 가까이서 밝게 찍어 주세요.', true); });
    };
    startCam();
  }
  function camOff(msg) { var o = $('#off'); if (o) { o.classList.remove('hidden'); o.innerHTML = '<div><b>' + esc(msg) + '</b><br><span class="small">아래에 관리번호를 입력하거나 사진으로 인식하세요.</span></div>'; } }
  function startCam() {
    if (!window.isSecureContext || !navigator.mediaDevices || !window.Html5Qrcode) return camOff('이 브라우저에서는 카메라를 쓸 수 없습니다.');
    try {
      var sc = new Html5Qrcode('reader', { verbose: false, formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE] });
      S.scanner = sc;
      sc.start({ facingMode: 'environment' }, { fps: 12, aspectRatio: 1, qrbox: function (w, h) { var s = Math.max(80, Math.floor(Math.min(w, h) * .64)); return { width: s, height: s }; } },
        function (t) { onCode(t, false); }, function () {})
        .catch(function (err) { S.scanner = null; camOff(/NotAllowed|Permission/i.test(String(err && (err.name || err))) ? '카메라 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.' : '카메라를 시작하지 못했습니다.'); });
    } catch (e) { camOff('카메라를 시작하지 못했습니다.'); }
  }
  function stopCam() {
    var sc = S.scanner; S.scanner = null;
    if (sc) { try { var st = sc.getState(); if (st === 2 || st === 3) sc.stop().catch(function () {}); } catch (e) { /* noop */ } }
  }
  function pauseCam() { try { if (S.scanner && S.scanner.getState() === 2) S.scanner.pause(true); } catch (e) { /* noop */ } }
  function resumeCam() { try { if (S.scanner && S.scanner.getState() === 3) S.scanner.resume(); } catch (e) { /* noop */ } }
  function onCode(code, manual) {
    if (S.busy) return;
    if (!manual && code === S.last && Date.now() - S.lastT < 3000) return;
    S.last = code; S.lastT = Date.now(); S.busy = true;
    pauseCam(); vib(30);
    api('lookup', { id: code }).then(function (d) { S.busy = false; itemSheet(d.item, null, d.default_due); })
      .catch(function (e) { S.busy = false; fail(e); resumeCam(); });
  }

  // ---------- 장비 시트: 반출 / 반납 ----------
  function itemSheet(it, after, defDue) {
    var back = document.createElement('div'); back.className = 'back';
    var out = it.status === '반출';
    var mine = out && it.holder === S.auth.name;
    var due = defDue || addDays(today(), 7);
    var html = '<div class="sheet"><div class="grab"></div><div class="mono mute">' + esc(it.id) + '</div><div class="eqname">' + esc(it.name) + '</div><div style="margin-top:8px">' + badge(it) + '</div>';
    if (!it.active) {
      html += '<p class="mute">숨김 처리된 장비입니다.</p><button class="btn w" data-x>닫기</button>';
    } else if (!out) {
      html += '<div class="stack" style="margin-top:16px"><div><label class="f">반납 예정일</label><input class="in" type="date" id="dd" min="' + today() + '" value="' + due + '">' +
        '<div class="chips">' + [[1, '내일'], [3, '3일'], [7, '1주'], [14, '2주'], [30, '한 달']].map(function (c) { return '<button type="button" data-d="' + c[0] + '"' + (addDays(today(), c[0]) === due ? ' class="on"' : '') + '>' + c[1] + '</button>'; }).join('') + '</div></div>' +
        '<div><label class="f">사용처 <span style="font-weight:500">(선택)</span></label><input class="in" id="pl" maxlength="100" placeholder="예: 성수 전시, 사내 촬영, 수리" value="' + esc(store('c2s.lastPlace') || '') + '"></div>' +
        '<button class="btn y" id="act">반출</button><button class="btn w" data-x>취소</button></div>';
    } else {
      html += '<dl class="kv"><dt>가져간 사람</dt><dd>' + esc(it.holder) + '</dd><dt>반납 예정</dt><dd' + (it.late ? ' style="color:var(--bad)"' : '') + '>' + esc(it.due_date) + (it.late ? ' (지연)' : '') + '</dd>' + (it.place ? '<dt>사용처</dt><dd>' + esc(it.place) + '</dd>' : '') + '</dl>' +
        '<div class="stack"><button class="btn k" id="act">' + (mine ? '반납' : esc(it.holder) + '님 장비 대신 반납') + '</button><button class="btn w" data-x>닫기</button></div>';
    }
    back.innerHTML = html + '</div>';
    document.body.appendChild(back);
    var closed = false;
    function close() { if (closed) return; closed = true; back.remove(); resumeCam(); }
    back.addEventListener('click', function (e) { if (e.target === back || e.target.closest('[data-x]')) close(); });
    $$('[data-d]', back).forEach(function (b) {
      b.onclick = function () { $('#dd', back).value = addDays(today(), +b.getAttribute('data-d')); $$('[data-d]', back).forEach(function (x) { x.classList.toggle('on', x === b); }); };
    });
    if ($('#dd', back)) $('#dd', back).onchange = function () { $$('[data-d]', back).forEach(function (x) { x.classList.remove('on'); }); };
    var act = $('#act', back);
    if (!act) return;
    var reqId = rid(); // 같은 버튼을 여러 번 눌러도 1번만 처리
    act.onclick = function () {
      var payload = { id: it.id, request_id: reqId };
      if (!out) {
        payload.due_date = $('#dd', back).value; payload.place = $('#pl', back).value.trim();
        if (!payload.due_date) return toast('반납 예정일을 고르세요.', true);
        store('c2s.lastPlace', payload.place);
      }
      act.disabled = true; act.textContent = '처리 중…';
      api(out ? 'return' : 'checkout', payload).then(function (d) {
        vib([40, 60, 40]);
        toast(out ? '반납 완료 · ' + it.name + (d.returned_for ? ' (' + d.returned_for + '님 대신)' : '') : '반출 완료 · ' + it.name + ' · ' + md(payload.due_date) + '까지');
        close();
        if (after) after();
      }).catch(function (e) { act.disabled = false; act.textContent = out ? '반납' : '반출'; fail(e); });
    };
  }

  // ---------- 관리 ----------
  function admin(tab) {
    S.view = 'admin';
    var v = shell('<h2>관리</h2><div class="tabs"><button data-t="eq">장비</button><button data-t="us">사람</button><button data-t="lg">기록</button></div><div id="ab"></div><button class="btn w" style="margin-top:16px" id="bk">처음으로</button>');
    $('#bk').onclick = home;
    $$('[data-t]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); b.onclick = function () { admin(b.getAttribute('data-t')); }; });
    var box = $('#ab');
    if (tab === 'eq') adminEq(box); else if (tab === 'us') adminUsers(box); else adminLog(box);
  }
  function adminEq(box) {
    box.innerHTML = '<div class="card stack"><label class="f" style="margin:0">장비 추가 — 한 줄에 하나씩</label><textarea class="in" id="names" placeholder="프로젝터 PT-RZ120 #1&#10;줌 렌즈 ET-D75LE6&#10;SDI 케이블 50m"></textarea><button class="btn y" id="add">추가</button></div>' +
      '<div class="section"><span>장비 목록</span><span class="row" style="flex:none;gap:6px"><button class="btn w sm" id="selall">전체 선택</button><button class="btn k sm" id="prt">선택 QR 인쇄</button></span></div><div class="list" id="el"><div class="empty">불러오는 중…</div></div>' +
      '<p class="small mute">QR 라벨은 A4 24칸 라벨지(64×33.9mm, 폼텍 3108 등)에 맞춰 인쇄됩니다. 인쇄 배율은 100%로.</p>';
    var items = [];
    function load() {
      api('list', { all: true }).then(function (d) {
        items = d.items;
        $('#el').innerHTML = items.length ? items.map(function (it) {
          return '<div class="item" style="cursor:default"><input type="checkbox" data-c="' + esc(it.id) + '" style="width:22px;height:22px"><div class="grow"><div class="nm">' + esc(it.name) + '</div><div class="sub mono">' + esc(it.id) + '</div></div>' + badge(it) +
            '<button class="btn w sm" data-e="' + esc(it.id) + '">수정</button></div>';
        }).join('') : '<div class="empty">아직 장비가 없습니다. 위에서 추가하세요.</div>';
        $$('[data-e]').forEach(function (b) {
          b.onclick = function () {
            var it = items.filter(function (x) { return x.id === b.getAttribute('data-e'); })[0];
            var n = prompt(it.id + ' 이름 변경\n"숨김" 입력 → 목록에서 숨김 / "복구" 입력 → 다시 표시', it.name);
            if (n === null || !n.trim()) return;
            var p = n.trim() === '숨김' ? { id: it.id, active: false } : n.trim() === '복구' ? { id: it.id, active: true } : { id: it.id, name: n.trim() };
            api('updateEquipment', p).then(function () { toast('저장됨'); load(); }).catch(fail);
          };
        });
      }).catch(fail);
    }
    $('#add').onclick = function () {
      var names = $('#names').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      if (!names.length) return toast('장비 이름을 입력하세요.', true);
      var b = this; b.disabled = true;
      api('addEquipment', { names: names }).then(function (d) {
        b.disabled = false; $('#names').value = '';
        toast(d.added.length + '개 추가 — QR을 인쇄해 붙이세요.');
        load();
        setTimeout(function () { d.added.forEach(function (a) { var c = $('[data-c="' + a.id + '"]'); if (c) c.checked = true; }); }, 600);
      }).catch(function (e) { b.disabled = false; fail(e); });
    };
    $('#selall').onclick = function () { var cs = $$('[data-c]'); var on = !cs.every(function (c) { return c.checked; }); cs.forEach(function (c) { c.checked = on; }); };
    $('#prt').onclick = function () {
      var ids = $$('[data-c]:checked').map(function (c) { return c.getAttribute('data-c'); });
      if (!ids.length) return toast('인쇄할 장비를 선택하세요.', true);
      printLabels(items.filter(function (x) { return ids.indexOf(x.id) >= 0; }));
    };
    load();
  }
  function qrSvg(text) {
    var q = qrcode(0, 'M'); q.addData(text); q.make();
    var n = q.getModuleCount(), z = 2, d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + z) + ' ' + (r + z) + 'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (n + 2 * z) + ' ' + (n + 2 * z) + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '"/></svg>';
  }
  function printLabels(items) {
    var per = 24, html = '';
    for (var p = 0; p < items.length; p += per) {
      html += '<div class="sheetA4">' + items.slice(p, p + per).map(function (it, i) {
        var col = i % 3, row = Math.floor(i / 3);
        return '<div class="lab" style="left:' + (9 + col * 64) + 'mm;top:' + (12.9 + row * 33.9) + 'mm"><div class="bar"></div>' + qrSvg(it.id) +
          '<div><img src="logo-h-black-print.png" alt=""><div class="id">' + esc(it.id) + '</div><div class="n">' + esc(it.name) + '</div></div></div>';
      }).join('') + '</div>';
    }
    $('#print').innerHTML = html;
    var imgs = $$('#print img');
    Promise.all(imgs.map(function (im) { return im.complete ? 0 : new Promise(function (r) { im.onload = im.onerror = r; }); })).then(function () { setTimeout(function () { window.print(); }, 50); });
  }
  function adminUsers(box) {
    box.innerHTML = '<div class="list" id="ul"><div class="empty">불러오는 중…</div></div><p class="small mute">새 직원은 사이트에서 "처음이에요"로 직접 가입합니다. 퇴사자는 "중지"하면 바로 막힙니다.</p>';
    function load() {
      api('users').then(function (d) {
        $('#ul').innerHTML = d.users.map(function (u) {
          var me = u.name === S.auth.name;
          return '<div class="item" style="cursor:default;flex-wrap:wrap"><div class="grow"><div class="nm">' + esc(u.name) + (me ? ' (나)' : '') + '</div><div class="sub">' + esc(u.role) + (u.active ? '' : ' · <b style="color:var(--bad)">중지됨</b>') + (u.has_pin ? '' : ' · PIN 초기화됨') + '</div></div>' +
            (me ? '' : '<div class="row" style="flex:none;gap:6px"><button class="btn w sm" data-a="' + esc(u.name) + '" data-v="' + (u.active ? 0 : 1) + '">' + (u.active ? '중지' : '재개') + '</button>' +
              '<button class="btn w sm" data-r="' + esc(u.name) + '" data-v="' + (u.role === '관리자' ? '직원' : '관리자') + '">' + (u.role === '관리자' ? '관리자 해제' : '관리자로') + '</button>' +
              '<button class="btn w sm" data-p="' + esc(u.name) + '">PIN 초기화</button></div>') + '</div>';
        }).join('');
        function upd(p, msg) { api('updateUser', p).then(function () { toast(msg); load(); }).catch(fail); }
        $$('[data-a]').forEach(function (b) { b.onclick = function () { upd({ name: b.getAttribute('data-a'), active: b.getAttribute('data-v') === '1' }, b.getAttribute('data-v') === '1' ? '재개됨' : '중지됨 — 바로 막힙니다'); }; });
        $$('[data-r]').forEach(function (b) { b.onclick = function () { upd({ name: b.getAttribute('data-r'), role: b.getAttribute('data-v') }, '변경됨'); }; });
        $$('[data-p]').forEach(function (b) { b.onclick = function () { if (confirm(b.getAttribute('data-p') + '님의 PIN을 초기화할까요? 본인이 "처음이에요"에서 새 PIN을 정합니다.')) upd({ name: b.getAttribute('data-p'), resetPin: true }, 'PIN 초기화됨'); }; });
      }).catch(fail);
    }
    load();
  }
  function adminLog(box) {
    box.innerHTML = '<div class="row" style="margin-bottom:10px"><input class="in" id="lq" placeholder="장비 · 사람 · 사용처 검색" style="flex:3"><button class="btn w sm" id="csv" style="min-height:52px">CSV</button></div><div class="card" style="padding:4px 10px;overflow:auto"><table><thead><tr><th>시각</th><th>구분</th><th>장비</th><th>사람</th><th>반납예정 · 사용처</th></tr></thead><tbody id="lb"><tr><td colspan="5" class="mute">불러오는 중…</td></tr></tbody></table></div>';
    api('log').then(function (d) {
      var rows = d.rows;
      function render() {
        var q = $('#lq').value.trim().toLowerCase();
        var r = rows.filter(function (x) { return !q || (x.equipment + ' ' + x.id + ' ' + x.person + ' ' + x.place).toLowerCase().indexOf(q) >= 0; });
        $('#lb').innerHTML = r.length ? r.map(function (x) {
          return '<tr><td class="small">' + esc(x.time.slice(5, 16).replace('T', ' ')) + '</td><td><span class="badge ' + (x.action === '반출' ? 'b-out' : 'b-in') + '">' + esc(x.action) + '</span></td><td>' + esc(x.equipment) + '<div class="small mute mono">' + esc(x.id) + '</div></td><td>' + esc(x.person) + '</td><td class="small">' + (x.action === '반출' ? md(x.due_date) + '까지 ' : '') + esc(x.place) + '</td></tr>';
        }).join('') : '<tr><td colspan="5" class="mute">기록이 없습니다.</td></tr>';
      }
      $('#lq').oninput = render;
      $('#csv').onclick = function () {
        var cols = ['time', 'action', 'id', 'equipment', 'person', 'due_date', 'place'];
        var csv = '﻿시각,구분,관리번호,장비,사람,반납예정,사용처\r\n' + rows.map(function (x) { return cols.map(function (c) { var s = String(x[c] || ''); if (/^[=+@-]/.test(s) && !/^\d/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(','); }).join('\r\n');
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'C2_반출반납기록_' + today() + '.csv'; a.click();
      };
      render();
    }).catch(fail);
  }

  // ---------- 시작 ----------
  if (!CFG.API_URL || /REPLACE/.test(CFG.API_URL)) { app.innerHTML = '<main><div class="card">config.js 에 API_URL 을 넣어 주세요.</div></main>'; return; }
  S.auth = store('c2s.auth');
  if (S.auth && S.auth.token) home(); else showLogin();
})();
</script>
</body>
</html>
