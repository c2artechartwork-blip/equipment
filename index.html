<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>C2 장비 반출·반납</title>
<link rel="icon" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<style>
@font-face { font-family: 'Pretendard'; src: url('PretendardVariable.woff2') format('woff2-variations'); font-weight: 45 920; font-display: swap; }
:root {
  --y: #F5B618; --k: #111; --bg: #F5F5F3; --line: #E4E4E0; --mute: #777; --ok: #2F855A; --okbg: #E8F5EE;
  --out: #2563EB; --outbg: #E8F0FE; --bad: #C53030; --badbg: #FDECEC;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--k); font-size: 16px; line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }
.hidden { display: none !important; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: -.02em; }
.mute { color: var(--mute); }
.small { font-size: 13px; }

header { position: sticky; top: 0; z-index: 10; background: var(--k); color: #fff; display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); }
header img { height: 22px; display: block; }
header .homebtn { display: inline-flex; align-items: center; justify-content: center; background: #222; color: var(--y); border: 1px solid #3A3A3A; border-radius: 999px; width: 44px; height: 40px; padding: 0; cursor: pointer; }
header .homebtn svg { width: 20px; height: 20px; }
header .homebtn.on { background: var(--y); color: var(--k); border-color: var(--y); }
header img { cursor: pointer; }
header .who { margin-left: auto; font-size: 14px; color: #ccc; background: none; border: 1px solid #333; border-radius: 999px; padding: 8px 14px; min-height: 40px; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border-radius: 14px; border: 0; font-weight: 800; font-size: 18px; cursor: pointer; text-decoration: none; }
.btn:disabled { opacity: .45; }
.btn.y { background: var(--y); color: var(--k); }
.btn.k { background: var(--k); color: #fff; }
.btn.w { background: #fff; color: var(--k); border: 1px solid var(--line); font-weight: 700; font-size: 16px; min-height: 48px; }
.btn.sm { white-space: nowrap; min-height: 38px; font-size: 14px; width: auto; padding: 0 14px; border-radius: 10px; }
.btn.big { min-height: 120px; font-size: 26px; border-radius: 20px; flex-direction: column; gap: 6px; }
.btn.big small { font-size: 14px; font-weight: 600; opacity: .7; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
label.f { display: block; font-size: 13px; font-weight: 700; color: var(--mute); margin-bottom: 6px; }
.in { width: 100%; min-height: 52px; border: 1px solid #CFCFCA; border-radius: 12px; padding: 0 14px; background: #fff; font-size: 17px; outline: none; }
.in:focus { border-color: var(--k); }
textarea.in { padding: 12px 14px; min-height: 120px; }
.pin { letter-spacing: .6em; text-align: center; font-size: 26px; font-weight: 800; }
h2 { margin: 4px 0 12px; font-size: 20px; }
.section { margin: 22px 0 8px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; }

.list { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EEE; cursor: pointer; min-height: 64px; }
.item:last-child { border-bottom: 0; }
.item .nm { font-weight: 800; }
.item .sub { font-size: 13px; color: var(--mute); }
.item .grow { flex: 1; min-width: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--mute); }
.badge { font-size: 13px; font-weight: 800; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.b-in { background: var(--okbg); color: var(--ok); }
.b-out { background: var(--outbg); color: var(--out); }
.b-late { background: var(--badbg); color: var(--bad); }
.b-off { background: #EEE; color: #888; }
.b-rep { background: #FFF0DD; color: #B45309; }
.b-lost { background: #F1E4E4; color: #7F1D1D; }
/* 현황 요약 */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.tile { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 12px; text-align: left; min-height: 64px; cursor: pointer; }
.tile b { display: block; font-size: 24px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; font-weight: 700; color: var(--mute); }
.tile.on { border: 2px solid var(--k); padding: 9px 11px; }
.tile.t-out b { color: var(--out); } .tile.t-late b { color: var(--bad); } .tile.t-rep b { color: #B45309; } .tile.t-lost b { color: #7F1D1D; } .tile.t-in b { color: var(--ok); }
.ctab { width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
.ctab th, .ctab td { text-align: right; padding: 8px 6px; white-space: nowrap; }
.ctab th:first-child, .ctab td:first-child { text-align: left; }
.ctab tbody tr { cursor: pointer; }
.ctab tbody tr.on td { background: #FFF6DA; font-weight: 800; }
.ctab .z { color: #CCC; }

.tabs { display: flex; background: #E9E9E5; border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.tabs button { flex: 1; border: 0; background: none; min-height: 44px; border-radius: 10px; font-weight: 800; color: var(--mute); }
.tabs button.on { background: #fff; color: var(--k); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* 스캔 */
.cam { position: relative; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 1/1; }
#reader { width: 100%; height: 100%; }
#reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
.frame { position: absolute; inset: 18%; border: 3px solid var(--y); border-radius: 18px; pointer-events: none; }
.camoff { position: absolute; inset: 0; color: #ddd; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }

/* 시트 */
.back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; animation: up .16s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: #DDD; margin: 4px auto 14px; }
.eqname { font-size: 24px; font-weight: 900; line-height: 1.25; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; min-height: 38px; padding: 0 14px; font-weight: 700; font-size: 14px; }
.chips button.on { background: var(--k); color: #fff; border-color: var(--k); }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 15px; margin: 12px 0; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; font-weight: 700; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 99; width: calc(100% - 32px); max-width: 420px; }
.t { background: var(--k); color: #fff; padding: 14px 16px; border-radius: 14px; margin-top: 8px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.t.err { background: #8E1F1F; }
.t.ok { border-left: 6px solid var(--y); }

.login { min-height: 100vh; min-height: 100dvh; background: var(--k); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 22px; }
.login img { width: 200px; }
.login .card { width: 100%; max-width: 360px; background: #1A1A1A; border-color: #2B2B2B; color: #fff; }
.login .in { background: #111; border-color: #3A3A3A; color: #fff; }
.login label.f { color: #AAA; }
.login .tabs { background: #222; }
.login .tabs button { color: #888; }
.login .tabs button.on { background: #333; color: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { padding: 8px 6px; border-bottom: 1px solid #EEE; text-align: left; vertical-align: top; }
th { color: var(--mute); font-size: 12px; }

/* 그룹 · 폼 */
.grp { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #FAFAF7; border-bottom: 1px solid #EEE; font-weight: 800; font-size: 14px; }
.grp .mute { font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
.in.sm { min-height: 44px; font-size: 15px; }
select.in { appearance: auto; }
.subtabs { display: flex; gap: 6px; margin-bottom: 12px; }
.subtabs button { border: 1px solid var(--line); background: #fff; border-radius: 999px; min-height: 40px; padding: 0 16px; font-weight: 800; }
.subtabs button.on { background: var(--k); color: #fff; border-color: var(--k); }
.b-on { background: #FFF3CF; color: #7A5600; }

/* 라벨 미리보기 (화면) */
.sheetmini { display: grid; gap: 3px; background: #EDEDE8; border-radius: 8px; padding: 8px; }
.sheetmini button { border: 1px dashed #C9C9C2; background: #fff; border-radius: 4px; min-height: 22px; font: 700 10px/1.1 ui-monospace, Menlo, monospace; color: #999; padding: 2px; overflow: hidden; }
.sheetmini button.used { background: #DADAD3; border-style: solid; color: #888; }
.sheetmini button.fill { background: var(--y); border: 1px solid #D9A100; color: var(--k); }
.sheetmini button.start { outline: 3px solid var(--k); outline-offset: -1px; }

/* 라벨 인쇄: 고른 기성 라벨지 규격으로 위치 계산 (mm) */
#print { display: none; }
@media print {
  @page { size: A4; margin: 0; }
  html, body { background: #fff !important; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; }
  .sheetA4 { width: 210mm; height: 297mm; position: relative; overflow: hidden; page-break-after: always; break-after: page; }
  .lab { position: absolute; display: flex; align-items: center; box-sizing: border-box; overflow: hidden; font-family: 'Pretendard', sans-serif; color: #000; }
  .lab.edge { outline: 0.2mm dashed #999; }
  .lab svg { flex: none; }
  .lab .tx { min-width: 0; }
  .lab img { display: block; }
  .lab .id { font-weight: 800; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }
  .lab .n { font-weight: 600; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .lab .bar { position: absolute; left: 0; top: 0; bottom: 0; background: #F5B618; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<div id="print"></div>
<div id="filescan" class="hidden"></div>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script src="html5-qrcode.min.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.C2EM_CONFIG || {};
  var app = document.getElementById('app');
  var S = { auth: null, scanner: null, busy: false, last: '', lastT: 0, view: 'home' };

  // ---------- 유틸 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function rid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, ''); }
  function today() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
  function addDays(d, n) { var p = d.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]) + n * 864e5).toISOString().slice(0, 10); }
  function md(d) { return d ? (+d.slice(5, 7)) + '/' + (+d.slice(8, 10)) : ''; }
  function toast(m, err) {
    var t = document.createElement('div'); t.className = 't ' + (err ? 'err' : 'ok'); t.textContent = m;
    $('#toast').appendChild(t); setTimeout(function () { t.remove(); }, err ? 4500 : 2200);
  }
  function vib(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* noop */ } }
  function badge(it) {
    if (!it.active) return '<span class="badge b-off">숨김</span>';
    if (it.status === '수리') return '<span class="badge b-rep">수리 중</span>';
    if (it.status === '분실') return '<span class="badge b-lost">분실</span>';
    if (it.status === '반출') return it.late ? '<span class="badge b-late">지연 · ' + esc(it.holder) + '</span>' : '<span class="badge b-out">반출 · ' + esc(it.holder) + '</span>';
    return '<span class="badge b-in">보유</span>';
  }

  // ---------- API ----------
  function post(body) {
    return fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('net'); return r.json(); });
  }
  function api(action, payload) {
    var body = JSON.stringify({ action: action, payload: payload || {}, auth: S.auth ? { name: S.auth.name, token: S.auth.token } : null });
    return post(body).catch(function () { return post(body); }) // 네트워크 오류 1회 재시도 (같은 request_id)
      .catch(function () { throw { code: 'NET', message: '인터넷 연결을 확인하세요.' }; })
      .then(function (r) {
        if (r.ok) return r.data;
        if ((r.error.code === 'AUTH' || r.error.code === 'PENDING') && S.auth) { store('c2s.auth', null); S.auth = null; setTimeout(showLogin, 50); }
        throw r.error;
      });
  }
  // 엑셀에서 바로 열리는 CSV (한글 깨짐 방지 BOM, 수식 주입 방지)
  function downloadCsv(head, rows, file) {
    var cell = function (v) { var x = String(v == null ? '' : v); if (/^[=+@\-]/.test(x) && !/^-?\d/.test(x)) x = "'" + x; return /[",\r\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
    var csv = '\uFEFF' + [head].concat(rows).map(function (r) { return r.map(cell).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = file; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); URL.revokeObjectURL(a.href); }, 2000);
  }
  /** 아래에서 올라오는 시트. 반환: { el, close } */
  function openSheet(html, onClose) {
    var back = document.createElement('div'); back.className = 'back';
    back.innerHTML = '<div class="sheet"><div class="grab"></div>' + html + '</div>';
    document.body.appendChild(back);
    var closed = false;
    function close() { if (closed) return; closed = true; back.remove(); if (onClose) onClose(); }
    back.addEventListener('click', function (e) { if (e.target === back || e.target.closest('[data-x]')) close(); });
    return { el: back, close: close };
  }
  /** confirm() 대신 쓰는 확인창 (브라우저 기본 확인창은 일부 환경에서 막힘) */
  function ask(msg, okLabel) {
    return new Promise(function (res) {
      var done = false;
      var sh = openSheet('<p style="font-size:17px;font-weight:700;margin:4px 0 18px">' + esc(msg) + '</p><div class="stack"><button class="btn k" id="ok">' + esc(okLabel || '확인') + '</button><button class="btn w" data-x>취소</button></div>', function () { if (!done) res(false); });
      $('#ok', sh.el).onclick = function () { done = true; sh.close(); res(true); };
    });
  }
  function fail(e) { if (e && e.silent) return; toast(e && e.message || '오류가 발생했습니다.', true); }
  // 화면을 옮긴 뒤 늦게 도착한 응답은 무시 (느린 서버 대비)
  function vapi(action, payload) { var g = S.gen; return api(action, payload).then(function (d) { if (g !== S.gen) throw { silent: true }; return d; }); }

  // ---------- 로그인 / 가입 ----------
  function showLogin(mode) {
    stopCam();
    mode = mode || 'login';
    app.innerHTML = '<div class="login"><img src="logo-h-yellow.png" alt="C2 ARTECHNOLOZY"><div style="letter-spacing:.18em;font-weight:800;color:var(--y);font-size:13px">장비 반출 · 반납</div>' +
      '<div class="card"><div class="tabs"><button data-m="login" class="' + (mode === 'login' ? 'on' : '') + '">로그인</button><button data-m="signup" class="' + (mode === 'signup' ? 'on' : '') + '">처음이에요</button></div>' +
      '<form class="stack" id="lf"><div><label class="f">이름</label><input class="in" id="ln" autocomplete="username" maxlength="20" value="' + esc((store('c2s.lastName') || '')) + '" placeholder="예: 홍길동"></div>' +
      '<div><label class="f">' + (mode === 'signup' ? '사용할 PIN (숫자 4자리)' : 'PIN 4자리') + '</label><input class="in pin" id="lp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="' + (mode === 'signup' ? 'new-password' : 'current-password') + '"></div>' +
      (mode === 'signup' ? '<div><label class="f">PIN 한 번 더</label><input class="in pin" id="lp2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"></div>' : '') +
      '<button class="btn y" id="lb">' + (mode === 'signup' ? '가입 신청' : '로그인') + '</button></form>' +
      '<p class="small" style="color:#888;margin:12px 0 0;text-align:center">' + (mode === 'signup' ? '가입 신청 후 관리자가 승인하면 쓸 수 있어요. 이름은 기록에 그대로 남습니다.' : 'PIN을 잊었으면 관리자에게 초기화를 요청하세요.') + '</p></div></div>';
    $$('[data-m]').forEach(function (b) { b.onclick = function () { showLogin(b.getAttribute('data-m')); }; });
    $('#lf').onsubmit = function (e) {
      e.preventDefault();
      var name = $('#ln').value.trim(), pin = $('#lp').value.trim();
      if (!name) return toast('이름을 입력하세요.', true);
      if (!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.', true);
      if (mode === 'signup' && pin !== $('#lp2').value.trim()) return toast('PIN이 서로 다릅니다.', true);
      var b = $('#lb'); b.disabled = true;
      api(mode, { name: name, pin: pin }).then(function (d) {
        if (d.pending) { store('c2s.lastName', d.user.name); return pendingScreen(d.user.name); }
        S.auth = { name: d.user.name, role: d.user.role, token: d.token };
        store('c2s.auth', S.auth); store('c2s.lastName', d.user.name);
        if (mode === 'signup' && d.user.role === '관리자') toast('첫 가입자라 관리자가 되었습니다.');
        home();
      }).catch(function (e) {
        b.disabled = false;
        if (e.code === 'RESET' || e.code === 'NOT_FOUND') { toast(e.message, true); return showLogin('signup'); }
        if (e.code === 'PENDING') return pendingScreen(name);
        fail(e);
      });
    };
    setTimeout(function () { ($('#ln').value ? $('#lp') : $('#ln')).focus(); }, 50);
  }

  function pendingScreen(name) {
    app.innerHTML = '<div class="login"><img src="logo-h-yellow.png" alt="C2 ARTECHNOLOZY"><div class="card stack" style="text-align:center">' +
      '<div style="font-size:20px;font-weight:900">가입 신청 완료</div><p style="margin:0;color:#ccc">' + esc(name) + '님의 신청이 관리자에게 전달됐어요.<br>승인되면 같은 이름과 PIN으로 로그인하면 됩니다.</p>' +
      '<button class="btn y" id="bk">로그인 화면으로</button></div></div>';
    $('#bk').onclick = function () { showLogin('login'); };
  }

  // ---------- 화면 틀 ----------
  function shell(inner) {
    stopCam(); S.gen = (S.gen || 0) + 1;

  function home() {
    S.view = 'home';
    var v = shell('<div id="pend"></div><button class="btn y big" id="go"><span>QR 스캔</span><small>장비 QR을 비추면 반출 · 반납</small></button>' +
      '<div class="section"><span>내가 가진 장비</span><span class="mute small" id="cnt"></span></div><div class="list" id="mine"><div class="empty">불러오는 중…</div></div>' +
      '<div class="row" style="margin-top:16px"><button class="btn w" id="all">전체 장비 현황</button>' + (S.auth.role === '관리자' ? '<button class="btn w" id="adm">관리</button>' : '') + '</div>');

    vapi('me').then(function (d) {

      $('#cnt').textContent = d.mine.length ? d.mine.length + '개' : '';

  }
  function rowHtml(it) {
    var sub = it.status === '반출' ? '반납 ' + md(it.due_date) + (it.place ? ' · ' + esc(it.place) : '') : '';
    return '<div class="item" data-id="' + esc(it.id) + '"><div class="grow"><div class="nm">' + esc(it.name) + '</div><div class="sub"><span class="mono">' + esc(it.id) + '</span>' + (sub ? ' · ' + sub : '') + '</div></div>' + badge(it) + '</div>';
  }
  function bindRows(root, items, after) {
    $$('.item[data-id]', root).forEach(function (el) {
      el.onclick = function () { var it = items.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; itemSheet(it, after); };

  // ---------- 전체 현황 ----------
  var STATS = [['', '전체', ''], ['보유', '보유', 't-in'], ['반출', '반출', 't-out'], ['late', '지연', 't-late'], ['수리', '수리 중', 't-rep'], ['분실', '분실', 't-lost']];
  function statOf(it, f) { return f === '' ? true : f === 'late' ? it.late : it.status === f; }
  function eqCsv(items, file) {
    downloadCsv(['관리번호', '분류', '장비명', '브랜드', '모델명', '사양', '사이즈', '메모', '상태', '가져간 사람', '반출일', '반납 예정일', '지연', '프로젝트', '표시'],
      items.map(function (it) { return [it.id, it.category, it.name, it.brand, it.model, it.spec, it.size, it.note, it.status, it.holder, it.out_date, it.due_date, it.late ? '지연' : '', it.place, it.active ? '' : '숨김']; }), file);
  }
  function all() {
    S.view = 'all';
    shell('<div class="row" style="justify-content:space-between"><h2 style="margin:0;flex:none">전체 장비</h2><button class="btn w sm" id="xls" style="flex:none">엑셀 다운로드 (전체)</button></div>' +
      '<div class="tiles" id="tl"></div><div class="card" style="padding:4px 10px;overflow-x:auto;margin-bottom:12px" id="ct"><div class="empty">불러오는 중…</div></div>' +
      '<input class="in" id="q" placeholder="이름 · 관리번호 · 사람 · 프로젝트 검색"><div class="section" style="margin-top:14px"><span id="lt">장비</span><button class="btn w sm hidden" id="clr" style="flex:none">필터 해제</button></div><div class="list" id="l"><div class="empty">불러오는 중…</div></div>' +
      '<button class="btn w" style="margin-top:16px" id="bk">처음으로</button>');
    $('#bk').onclick = home;
    var f = '', cf = null, data = [];
    $('#xls').onclick = function () { if (!data.length) return toast('내려받을 장비가 없습니다.', true); eqCsv(data, 'C2_equipment_' + today() + '.csv'); };
    vapi('list').then(function (d) {
      data = d.items;
      var cats = catsOf(data).filter(function (c) { return data.some(function (it) { return it.category === c; }); });
      if (data.some(function (it) { return !it.category; })) cats.push('');
      function render() {
        var inCat = data.filter(function (it) { return cf === null || (it.category || '') === cf; });
        $('#tl').innerHTML = STATS.map(function (x) {
          return '<button type="button" class="tile ' + x[2] + (f === x[0] ? ' on' : '') + '" data-f="' + x[0] + '"><b>' + inCat.filter(function (it) { return statOf(it, x[0]); }).length + '</b><span>' + x[1] + '</span></button>';
        }).join('');
        $('#ct').innerHTML = cats.length ? '<table class="ctab"><thead><tr><th>분류</th>' + STATS.map(function (x) { return '<th>' + x[1].replace(' 중', '') + '</th>'; }).join('') + '</tr></thead><tbody>' +
          cats.map(function (c) {
            var rows = data.filter(function (it) { return (it.category || '') === c; });
            return '<tr data-c="' + esc(c) + '"' + (cf === c ? ' class="on"' : '') + '><td>' + esc(c || '분류 없음') + '</td>' + STATS.map(function (x) { var n = rows.filter(function (it) { return statOf(it, x[0]); }).length; return '<td' + (n ? '' : ' class="z"') + '>' + n + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>' : '<div class="empty">장비가 없습니다.</div>';
        $$('#tl [data-f]').forEach(function (b) { b.onclick = function () { f = b.getAttribute('data-f'); render(); }; });
        $$('#ct [data-c]').forEach(function (tr) { tr.onclick = function () { var c = tr.getAttribute('data-c'); cf = cf === c ? null : c; render(); }; });
        var q = $('#q').value.trim().toLowerCase();
        var items = inCat.filter(function (it) {
          if (!statOf(it, f)) return false;
          return !q || [it.name, it.id, it.holder, it.place, it.category, it.brand, it.model].join(' ').toLowerCase().indexOf(q) >= 0;
        });
        var label = [cf === null ? '' : (cf || '분류 없음'), f ? (STATS.filter(function (x) { return x[0] === f; })[0] || [])[1] : ''].filter(Boolean).join(' · ');
        $('#lt').textContent = (label || '전체') + ' ' + items.length + '개';
        $('#clr').classList.toggle('hidden', !(f || cf !== null || q));
        $('#l').innerHTML = items.length ? items.map(rowHtml).join('') : '<div class="empty">없습니다.</div>';
        bindRows($('#l'), items, all);
      }
      $('#q').oninput = render;
      $('#clr').onclick = function () { f = ''; cf = null; $('#q').value = ''; render(); };
      render();
    }).catch(fail);
  }

  // ---------- 스캔 ----------
  function scan() {
    S.view = 'scan';
    var v = shell('<div class="cam"><div id="reader"></div><div class="frame"></div><div class="camoff hidden" id="off"></div></div>' +
      '<p class="mute small" style="text-align:center;margin:10px 0">QR을 노란 네모 안에 맞추세요</p>' +
      '<form class="row" id="mf"><input class="in mono" id="mc" placeholder="관리번호 직접 입력 (C2-0001)" autocapitalize="characters" style="flex:2"><button class="btn k sm" style="min-height:52px">확인</button></form>' +
      '<label class="btn w" style="margin-top:10px">사진 찍어서 QR 인식<input type="file" accept="image/*" capture="environment" id="fs" class="hidden"></label>' +
      '<button class="btn w" style="margin-top:10px" id="bk">처음으로</button>');
    $('#bk').onclick = home;
    $('#mf').onsubmit = function (e) { e.preventDefault(); var c = $('#mc').value.trim(); if (c) { $('#mc').value = ''; onCode(c, true); } };
    $('#fs').onchange = function (e) {
      var file = e.target.files[0]; e.target.value = '';
      if (!file || !window.Html5Qrcode) return;
      new Html5Qrcode('filescan').scanFile(file, false).then(function (c) { onCode(c, true); }).catch(function () { toast('사진에서 QR을 못 찾았습니다. 가까이서 밝게 찍어 주세요.', true); });
    };
    startCam();
  }
  function camOff(msg) { var o = $('#off'); if (o) { o.classList.remove('hidden'); o.innerHTML = '<div><b>' + esc(msg) + '</b><br><span class="small">아래에 관리번호를 입력하거나 사진으로 인식하세요.</span></div>'; } }
  function startCam() {
    if (!window.isSecureContext || !navigator.mediaDevices || !window.Html5Qrcode) return camOff('이 브라우저에서는 카메라를 쓸 수 없습니다.');
    try {
      var sc = new Html5Qrcode('reader', { verbose: false, formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE] });
      S.scanner = sc;
      sc.start({ facingMode: 'environment' }, { fps: 12, aspectRatio: 1, qrbox: function (w, h) { var s = Math.max(80, Math.floor(Math.min(w, h) * .64)); return { width: s, height: s }; } },
        function (t) { onCode(t, false); }, function () {})
        .catch(function (err) { S.scanner = null; camOff(/NotAllowed|Permission/i.test(String(err && (err.name || err))) ? '카메라 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.' : '카메라를 시작하지 못했습니다.'); });
    } catch (e) { camOff('카메라를 시작하지 못했습니다.'); }
  }
  function stopCam() {
    var sc = S.scanner; S.scanner = null;
    if (sc) { try { var st = sc.getState(); if (st === 2 || st === 3) sc.stop().catch(function () {}); } catch (e) { /* noop */ } }
  }
  function pauseCam() { try { if (S.scanner && S.scanner.getState() === 2) S.scanner.pause(true); } catch (e) { /* noop */ } }
  function resumeCam() { try { if (S.scanner && S.scanner.getState() === 3) S.scanner.resume(); } catch (e) { /* noop */ } }
  function onCode(code, manual) {
    if (S.busy) return;
    if (!manual && code === S.last && Date.now() - S.lastT < 3000) return;
    S.last = code; S.lastT = Date.now(); S.busy = true;
    pauseCam(); vib(30);
    api('lookup', { id: code }).then(function (d) { S.busy = false; itemSheet(d.item, null, d.default_due); })
      .catch(function (e) { S.busy = false; fail(e); resumeCam(); });
  }

  // ---------- 장비 시트: 반출 / 반납 ----------
  function itemSheet(it, after, defDue) {
    var back = document.createElement('div'); back.className = 'back';
    var out = it.status === '반출';
    var mine = out && it.holder === S.auth.name;
    var due = defDue || addDays(today(), 7);
    var det = [['분류', it.category], ['브랜드', it.brand], ['모델명', it.model], ['사양', it.spec], ['사이즈', it.size], ['메모', it.note]].filter(function (x) { return x[1]; });
    var html = '<div class="sheet"><div class="grab"></div><div class="mono mute">' + esc(it.id) + '</div><div class="eqname">' + esc(it.name) + '</div><div style="margin-top:8px">' + badge(it) + '</div>' +
      (det.length ? '<dl class="kv" style="font-size:14px;margin:12px 0 0">' + det.map(function (x) { return '<dt>' + x[0] + '</dt><dd style="font-weight:600">' + esc(x[1]) + '</dd>'; }).join('') + '</dl>' : '');
    if (!it.active) {
      html += '<p class="mute">숨김 처리된 장비입니다.</p><button class="btn w" data-x>닫기</button>';
    } else if (it.status === '수리' || it.status === '분실') {
      html += '<p style="font-weight:700;margin:16px 0">' + (it.status === '수리' ? '수리 중이라 지금은 반출할 수 없어요.' : '분실 처리된 장비예요. 찾았다면 관리자에게 알려 주세요.') + '</p><button class="btn w" data-x>닫기</button>';
    } else if (!out) {
      html += '<div class="stack" style="margin-top:16px"><div><label class="f">반납 예정일</label><input class="in" type="date" id="dd" min="' + today() + '" value="' + due + '">' +
        '<div class="chips">' + [[1, '내일'], [3, '3일'], [7, '1주'], [14, '2주'], [30, '한 달']].map(function (c) { return '<button type="button" data-d="' + c[0] + '"' + (addDays(today(), c[0]) === due ? ' class="on"' : '') + '>' + c[1] + '</button>'; }).join('') + '</div></div>' +
        '<div><label class="f">프로젝트 · 사용처 <span style="font-weight:500">(선택)</span></label>' +
        ((S.projects || []).length ? '<div class="chips" style="margin:0 0 8px">' + S.projects.slice(0, 8).map(function (p) { return '<button type="button" data-pj="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div>' : '') +
        '<input class="in" id="pl" maxlength="100" list="pjl" placeholder="고르거나 새로 입력 (예: 성수 전시, 수리)" value="' + esc(store('c2s.lastPlace') || '') + '"><datalist id="pjl">' + (S.projects || []).map(function (p) { return '<option value="' + esc(p) + '">'; }).join('') + '</datalist></div>' +
        '<button class="btn y" id="act">반출</button><button class="btn w" data-x>취소</button></div>';
    } else {
      html += '<dl class="kv"><dt>가져간 사람</dt><dd>' + esc(it.holder) + '</dd><dt>반납 예정</dt><dd' + (it.late ? ' style="color:var(--bad)"' : '') + '>' + esc(it.due_date) + (it.late ? ' (지연)' : '') + '</dd>' + (it.place ? '<dt>프로젝트</dt><dd>' + esc(it.place) + '</dd>' : '') + '</dl>' +
        '<div class="stack"><button class="btn k" id="act">' + (mine ? '반납' : esc(it.holder) + '님 장비 대신 반납') + '</button><button class="btn w" data-x>닫기</button></div>';
    }
    back.innerHTML = html + '</div>';
    document.body.appendChild(back);
    var closed = false;
    function close() { if (closed) return; closed = true; back.remove(); resumeCam(); }
    back.addEventListener('click', function (e) { if (e.target === back || e.target.closest('[data-x]')) close(); });
    $$('[data-d]', back).forEach(function (b) {
      b.onclick = function () { $('#dd', back).value = addDays(today(), +b.getAttribute('data-d')); $$('[data-d]', back).forEach(function (x) { x.classList.toggle('on', x === b); }); };
    });
    function markPj() { var v = $('#pl', back) && $('#pl', back).value.trim(); $$('[data-pj]', back).forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-pj') === v); }); }
    $$('[data-pj]', back).forEach(function (b) { b.onclick = function () { $('#pl', back).value = b.getAttribute('data-pj'); markPj(); }; });
    if ($('#pl', back)) { $('#pl', back).oninput = markPj; markPj(); }
    if ($('#dd', back)) $('#dd', back).onchange = function () { $$('[data-d]', back).forEach(function (x) { x.classList.remove('on'); }); };
    var act = $('#act', back);
    if (!act) return;
    var reqId = rid(); // 같은 버튼을 여러 번 눌러도 1번만 처리
    act.onclick = function () {
      var payload = { id: it.id, request_id: reqId };
      if (!out) {
        payload.due_date = $('#dd', back).value; payload.place = $('#pl', back).value.trim();
        if (!payload.due_date) return toast('반납 예정일을 고르세요.', true);
        store('c2s.lastPlace', payload.place);
      }
      act.disabled = true; act.textContent = '처리 중…';
      api(out ? 'return' : 'checkout', payload).then(function (d) {
        vib([40, 60, 40]);
        if (!out && payload.place && (S.projects || []).indexOf(payload.place) < 0) (S.projects = S.projects || []).unshift(payload.place);
        toast(out ? '반납 완료 · ' + it.name + (d.returned_for ? ' (' + d.returned_for + '님 대신)' : '') : '반출 완료 · ' + it.name + ' · ' + md(payload.due_date) + '까지');
        close();
        if (after) after();
      }).catch(function (e) { act.disabled = false; act.textContent = out ? '반납' : '반출'; fail(e); });
    };
  }

  // ---------- 관리 ----------

  var CATS = ['프로젝터', '프로젝터 렌즈', '스피커', '서버', '컨트롤러', 'TV', '모니터'];

  function adminEq(box) {

      '<div><label class="f">분류</label><div class="chips" id="cats"></div>' +

      fieldsHtml() +
      '<div><label class="f">수량</label><div class="row" style="gap:8px"><button type="button" class="btn w" id="qm" style="flex:none;width:56px">−</button><input class="in" id="qty" type="number" inputmode="numeric" min="1" max="100" value="1" style="text-align:center;font-weight:800"><button type="button" class="btn w" id="qp" style="flex:none;width:56px">+</button></div></div>' +

    { k: 'QR-3990', t: '소', d: '폼텍 QR 전용 라벨 3990 · 28칸 · 40×40mm · QR + 관리번호', c: 4, r: 7, w: 40, h: 40, gx: 3, gy: 0, left: 20.5, top: 7 },
    { k: 'custom', t: '직접 입력', d: '다른 라벨지: 칸 수와 치수를 직접 넣으세요', c: 3, r: 8, w: 64, h: 34, gx: 0, gy: 0 }
  ];
  var DIMS = [['c', '가로 칸 수'], ['r', '세로 칸 수'], ['w', '라벨 가로'], ['h', '라벨 세로'], ['gx', '좌우 간격'], ['gy', '상하 간격'], ['left', '왼쪽 여백'], ['top', '위 여백']];
  function dimsOf(cfg) { // 기본 규격 위에 이 기기에서 재서 넣은 값을 덮어씀
    var L = LABELS.filter(function (x) { return x.k === cfg.k; })[0] || LABELS[0];
    var o = { c: L.c, r: L.r, w: L.w, h: L.h, gx: L.gx, gy: L.gy, left: L.left != null ? L.left : '', top: L.top != null ? L.top : '' }, ov = (cfg.over || {})[L.k] || {};
    DIMS.forEach(function (d) { if (ov[d[0]] !== undefined && ov[d[0]] !== '') o[d[0]] = ov[d[0]]; });
    return o;
  }
  function labelSpec(cfg) {
    var t = dimsOf(cfg);
    var c = +t.c, r = +t.r, w = +t.w, h = +t.h, gx = +t.gx || 0, gy = +t.gy || 0;
    var left = t.left !== '' && t.left != null ? +t.left : (210 - c * w - (c - 1) * gx) / 2;
    var top = t.top !== '' && t.top != null ? +t.top : (297 - r * h - (r - 1) * gy) / 2;
    return { c: c, r: r, w: w, h: h, gx: gx, gy: gy, left: left + (+cfg.dx || 0), top: top + (+cfg.dy || 0) };
  }
  function labelSheet(items) {

    var sh = openSheet('<div style="font-weight:900;font-size:20px">QR 라벨 인쇄 · ' + items.length + '개</div><div class="stack" style="margin-top:12px">' +

      '<div class="small mute" id="ld" style="margin-top:6px"></div><div class="row" id="lnk" style="gap:6px;margin-top:8px;flex-wrap:wrap"></div></div>' +
      '<details id="dm"' + (cfg.k === 'custom' ? ' open' : '') + '><summary style="font-weight:800;font-size:14px;cursor:pointer;min-height:32px">치수 조정 (mm) — 라벨지를 자로 재서 맞추기</summary>' +
      '<div class="grid2" style="margin-top:8px">' + DIMS.map(function (d) { return '<div><label class="f">' + d[1] + (d[0] === 'c' || d[0] === 'r' ? '' : ' mm') + '</label><input class="in sm" type="number" step="0.1" inputmode="decimal" data-cu="' + d[0] + '" placeholder="' + (d[0] === 'left' || d[0] === 'top' ? '비우면 가운데' : '') + '"></div>'; }).join('') + '</div>' +
      '<p class="small mute" style="margin:6px 0 0">왼쪽·위 여백 = 용지 끝에서 첫 칸까지. 간격 = 칸과 칸 사이. 바꾼 값은 라벨지 종류별로 이 기기에 저장됩니다. <button type="button" class="btn w sm" id="rs" style="display:inline-flex;min-height:30px;margin-left:4px">기본값으로</button></p></details>' +
      '<div><label class="f">시작 칸 — 이미 쓴 칸은 건너뛰고, 붙일 첫 칸을 누르세요</label><div class="sheetmini" id="mini"></div><div class="small mute" id="pinfo" style="margin-top:6px"></div></div>' +
      '<div class="grid2"><div><label class="f">가로 미세조정 mm (+ 오른쪽)</label><input class="in sm" type="number" step="0.5" id="dx" value="' + (cfg.dx || 0) + '"></div><div><label class="f">세로 미세조정 mm (+ 아래)</label><input class="in sm" type="number" step="0.5" id="dy" value="' + (cfg.dy || 0) + '"></div></div>' +
      '<label class="row" style="gap:8px;font-weight:700;font-size:14px"><input type="checkbox" id="edge" style="width:20px;height:20px;flex:none"' + (cfg.edge ? ' checked' : '') + '><span>칸 테두리 같이 인쇄 (처음엔 일반 A4에 시험 인쇄해서 라벨지와 겹쳐 보세요)</span></label>' +

    var r = sh.el;
    function fillDims() { var d = dimsOf(cfg); $$('[data-cu]', r).forEach(function (i) { var v = d[i.getAttribute('data-cu')]; i.value = v === '' || v == null ? '' : v; }); }
    function read() {

      }

  function qrSvg(text) {
    var q = qrcode(0, 'M'); q.addData(text); q.make();
    var n = q.getModuleCount(), z = 2, d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + z) + ' ' + (r + z) + 'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (n + 2 * z) + ' ' + (n + 2 * z) + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '"/></svg>';
  }
  function printLabels(items, sp, start, edge) {
    var per = sp.c * sp.r, slots = [], i, html = '';
    for (i = 0; i < start; i++) slots.push(null);
    items.forEach(function (it) { slots.push(it); });
    // 라벨 크기에 맞춰 QR·글자 크기 자동 조절
    var pad = Math.min(2.5, sp.h * 0.08), bar = Math.min(1.6, sp.w * 0.025);
    if (sp.h / sp.w > 0.75) return printSquare(slots, sp, per, edge);
    var qr = Math.min(sp.h - 2 * pad, sp.w * 0.42);
    var txtW = sp.w - qr - 2 * pad - bar - 2;
    var idPt = Math.max(6.5, Math.min(12, sp.h * 0.4, txtW * 0.32));
    var nPt = Math.max(5.5, Math.min(8, idPt * 0.68));
    var logo = sp.h >= 26 ? Math.min(22, txtW * 0.8) : 0;
    for (var p = 0; p < slots.length; p += per) {
      html += '<div class="sheetA4">' + slots.slice(p, p + per).map(function (it, k) {
        if (!it) return '';
        var col = k % sp.c, row = Math.floor(k / sp.c);
        var x = sp.left + col * (sp.w + sp.gx), y = sp.top + row * (sp.h + sp.gy);
        return '<div class="lab' + (edge ? ' edge' : '') + '" style="left:' + x.toFixed(2) + 'mm;top:' + y.toFixed(2) + 'mm;width:' + sp.w + 'mm;height:' + sp.h + 'mm;padding:' + pad + 'mm ' + pad + 'mm ' + pad + 'mm ' + (pad + bar) + 'mm;gap:' + Math.min(2.5, pad + 0.5) + 'mm">' +
          '<div class="bar" style="width:' + bar + 'mm"></div>' + qrSvg(it.id).replace('<svg ', '<svg style="width:' + qr.toFixed(2) + 'mm;height:' + qr.toFixed(2) + 'mm" ') +
          '<div class="tx">' + (logo ? '<img src="logo-h-black-print.png" alt="" style="width:' + logo.toFixed(1) + 'mm;margin-bottom:' + (sp.h > 32 ? 1.5 : 0.8) + 'mm">' : '') +
          '<div class="id" style="font-size:' + idPt.toFixed(1) + 'pt">' + esc(it.id) + '</div><div class="n" style="font-size:' + nPt.toFixed(1) + 'pt">' + esc(it.name) + '</div></div></div>';
      }).join('') + (edge ? edgeCells(sp, slots.slice(p, p + per).length, per) : '') + '</div>';
    }
    $('#print').innerHTML = html;
    var imgs = $$('#print img');
    Promise.all(imgs.map(function (im) { return im.complete ? 0 : new Promise(function (r) { im.onload = im.onerror = r; }); })).then(function () { setTimeout(function () { window.print(); }, 50); });
  }
  /** 정사각형·작은 라벨(예: 40×40): QR 위, 관리번호·이름 아래 */
  function printSquare(slots, sp, per, edge) { // 정사각형 라벨(69.8 / 40mm): QR + 관리번호만
    var pad = Math.max(1.5, Math.min(4, sp.w * 0.06)), idPt = Math.max(7, Math.min(16, sp.w * 0.22));
    var textH = idPt * 0.3528 * 1.15 + 0.8; // pt → mm
    var qr = Math.min(sp.w - 2 * pad, sp.h - 2 * pad - textH);
    var html = '';
    for (var p = 0; p < slots.length; p += per) {
      html += '<div class="sheetA4">' + slots.slice(p, p + per).map(function (it, k) {
        if (!it) return '';
        var col = k % sp.c, row = Math.floor(k / sp.c);
        var x = sp.left + col * (sp.w + sp.gx), y = sp.top + row * (sp.h + sp.gy);
        return '<div class="lab sq' + (edge ? ' edge' : '') + '" style="left:' + x.toFixed(2) + 'mm;top:' + y.toFixed(2) + 'mm;width:' + sp.w + 'mm;height:' + sp.h + 'mm;padding:' + pad + 'mm;flex-direction:column;justify-content:center;align-items:center;gap:0.8mm">' +
          qrSvg(it.id).replace('<svg ', '<svg style="width:' + qr.toFixed(2) + 'mm;height:' + qr.toFixed(2) + 'mm" ') +
          '<div class="id" style="font-size:' + idPt.toFixed(1) + 'pt;line-height:1.15">' + esc(it.id) + '</div></div>';
      }).join('') + (edge ? edgeCells(sp, 0, per) : '') + '</div>';
    }
    $('#print').innerHTML = html;
    setTimeout(function () { window.print(); }, 50);
  }
  function edgeCells(sp, from, per) { // 시험 인쇄: 빈 칸 테두리도 그려서 라벨지와 맞춰 보기
    var out = '';
    for (var k = 0; k < per; k++) {
      var col = k % sp.c, row = Math.floor(k / sp.c);
      out += '<div class="lab edge" style="left:' + (sp.left + col * (sp.w + sp.gx)).toFixed(2) + 'mm;top:' + (sp.top + row * (sp.h + sp.gy)).toFixed(2) + 'mm;width:' + sp.w + 'mm;height:' + sp.h + 'mm"></div>';
    }
    return out;
  }

        '<div class="section"><span>반출 · 반납 기록</span><span class="mute small">' + d.rows.length + '건</span></div>' + logTable(d.rows, false);
      bindRows($('#po'), d.out_now, function () { projectView(name); });
      bindRows($('#pu'), d.used, function () { projectView(name); });
      $('#st').onclick = function () { api('saveProject', { name: name, status: on ? '종료' : '진행' }).then(function () { toast(on ? '종료했습니다. 반출 화면 목록에서 빠집니다.' : '진행으로 바꿨습니다.'); projectView(name); }).catch(fail); };
      $('#pcsv').onclick = function () { logCsv(d.rows, 'C2_project_' + today() + '.csv'); };
      $('#rn').onclick = function () {
        var sh = openSheet('<div style="font-weight:800;margin-bottom:10px">프로젝트 이름 변경</div><div class="stack"><input class="in" id="nn" maxlength="100" value="' + esc(name) + '"><p class="small mute" style="margin:0">지난 기록의 프로젝트 이름도 함께 바뀝니다.</p><button class="btn y" id="ok">저장</button><button class="btn w" data-x>취소</button></div>');
        $('#ok', sh.el).onclick = function () {
          var to = $('#nn', sh.el).value.trim(); if (!to || to === name) return sh.close();
          api('saveProject', { name: name, newName: to }).then(function () { toast('바꿨습니다.'); sh.close(); projectView(to); }).catch(fail);
        };
      };
    }).catch(fail);
  }

  // ---------- 시작 ----------
  if (!CFG.API_URL || /REPLACE/.test(CFG.API_URL)) { app.innerHTML = '<main><div class="card">config.js 에 API_URL 을 넣어 주세요.</div></main>'; return; }
  S.auth = store('c2s.auth');
  if (S.auth && S.auth.token) home(); else showLogin();
})();
</script>
</body>
</html>
